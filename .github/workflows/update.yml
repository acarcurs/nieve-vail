name: Actualizar datos

on:
  schedule:
    - cron: "23 */3 * * *"        # cada 3 horas (UTC)
  push:
    branches: [main]
    paths: ["pipeline/**", "!pipeline/train.py", ".github/workflows/update.yml"]
  workflow_dispatch:
    inputs:
      osm:
        description: "Refrescar pistas y telesillas de OpenStreetMap"
        type: boolean
        default: false
      sat_backfill:
        description: "Analizar pasadas de Sentinel-2 desde esta fecha (AAAA-MM-DD), opcional"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Descargar y calcular
        env:
          OSM: ${{ inputs.osm }}
          SAT_BACKFILL: ${{ inputs.sat_backfill }}
        run: |
          ARGS=""
          if [ "$OSM" = "true" ]; then ARGS="$ARGS --osm"; fi
          if [ -n "$SAT_BACKFILL" ]; then ARGS="$ARGS --sat-backfill $SAT_BACKFILL"; fi
          python pipeline/update.py $ARGS
      - name: Guardar datos
        run: |
          git config user.name "nieve-vail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "datos: $(TZ=America/Denver date '+%Y-%m-%d %H:%M') MT"
          for i in 1 2 3; do
            git push && exit 0
            git pull -q --rebase -X theirs origin main
            sleep 3
          done
          exit 1

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
