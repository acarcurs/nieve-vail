name: Capturas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/screenshot.py", ".github/workflows/screenshot.yml", "tools/capturas.txt"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Esperar a que GitHub Pages publique
        run: sleep 60
      - run: python tools/screenshot.py shots
      - name: Guardar en la rama capturas
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "nieve-vail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "capturas $(date -u '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
