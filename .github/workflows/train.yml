name: Entrenar Claude

on:
  schedule:
    - cron: "41 9 * * 1"          # lunes
  push:
    branches: [main]
    paths: ["pipeline/train.py", ".github/workflows/train.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Entrenar con pronósticos de temporadas pasadas
        run: python pipeline/train.py
      - name: Guardar modelo
        run: |
          git config user.name "nieve-vail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cumbre_model.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Claude: reentrenado $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do
            git push && exit 0
            git pull -q --rebase -X theirs origin main
            sleep 3
          done
          exit 1
