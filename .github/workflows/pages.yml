name: Publicar página

on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "favicon.svg", "data/insights.json", "data/static.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Armar sitio
        run: |
          mkdir _site
          cp -r index.html assets data .nojekyll _site/
          [ -f favicon.svg ] && cp favicon.svg _site/ || true
          rm -f _site/data/cumbre_log.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Esperar a que el artefacto esté disponible
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
